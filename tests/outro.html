<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Duomi Outro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background-color: #111216;
            color: #ffffff;
            font-family: 'Outfit', sans-serif;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }
        /* Background decorative elements */
        .glow {
            position: absolute;
            width: 600px;
            height: 600px;
            border-radius: 50%;
            background: radial-gradient(circle, rgba(255, 115, 97, 0.12) 0%, rgba(255, 115, 97, 0) 70%);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 1;
            filter: blur(40px);
            animation: pulse-glow 8s infinite alternate ease-in-out;
        }
        .container {
            text-align: center;
            z-index: 2;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        h2 {
            font-size: 38px;
            font-weight: 800;
            letter-spacing: -1px;
            margin-bottom: 8px;
            animation: fade-in-up 0.8s ease-out forwards;
        }
        p {
            font-size: 18px;
            color: #9ca3af;
            font-weight: 300;
            max-width: 500px;
            line-height: 1.5;
            margin-bottom: 32px;
            opacity: 0;
            animation: fade-in 1s ease-out 0.3s forwards;
        }
        .badges-container {
            display: flex;
            gap: 20px;
            opacity: 0;
            animation: fade-in-up 1s ease-out 0.6s forwards;
            justify-content: center;
        }
        .docker-badge {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 20px 32px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
        }
        .code-block {
            font-family: monospace;
            background: #18191f;
            color: #ff7361;
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 14px;
            font-weight: bold;
            margin-top: 8px;
            border: 1px solid rgba(255, 115, 97, 0.15);
        }
        .logo-mark {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            margin-top: 40px;
            opacity: 0;
            animation: fade-in 1.2s ease-out 1s forwards;
        }
        .circle {
            width: 16px;
            height: 16px;
            border-radius: 50%;
        }
        .circle-a {
            background-color: #4a7bb0;
        }
        .circle-b {
            background-color: #4fd1c5;
        }
        .brand-text {
            font-size: 14px;
            font-weight: 800;
            color: #9ca3af;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        /* Animations */
        @keyframes pulse-glow {
            0% { transform: translate(-50%, -50%) scale(0.9); opacity: 0.8; }
            100% { transform: translate(-50%, -50%) scale(1.1); opacity: 1.2; }
        }
        @keyframes fade-in-up {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        @keyframes fade-in {
            to { opacity: 1; }
        }
    </style>
</head>
<body>
    <div class="glow"></div>
    <div class="container">
        <h2>Control Your Own Data</h2>
        <p>Duomi is 100% self-hosted. No external databases, no data sharing, and completely free.</p>
        
        <div class="badges-container">
            <div class="docker-badge">
                <span style="font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 1.5px; color: #9ca3af;">Run with Docker</span>
                <div class="code-block">docker pull ghcr.io/oscarb/duomi:latest</div>
            </div>
            
            <div class="docker-badge">
                <span style="font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 1.5px; color: #9ca3af;">Star on GitHub</span>
                <div class="code-block" style="color: #4fd1c5; border-color: rgba(79, 209, 197, 0.25);">oscarb/duomi</div>
            </div>
        </div>

        <div class="logo-mark">
            <div class="circle circle-a"></div>
            <div class="circle circle-b"></div>
            <span class="brand-text">Duomi</span>
        </div>
    </div>
</body>
</html>
